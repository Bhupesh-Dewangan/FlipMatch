<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>FlipMatch — Modern Card Matching Game</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Sound Toggle Floating Button -->
    <button id="sound-toggle-btn" class="icon-toggle-btn" aria-label="Toggle Sound" title="Toggle Sound">
      <svg id="sound-icon-on" class="icon-svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
        <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
        <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
      </svg>
      <svg id="sound-icon-off" class="icon-svg hidden" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
        <line x1="23" y1="9" x2="17" y2="15"></line>
        <line x1="17" y1="9" x2="23" y2="15"></line>
      </svg>
    </button>

    <!-- Start Screen -->
    <main id="start-screen" class="screen-view active">
      <div class="start-card">
        <header class="game-header">
          <div class="logo-badge" aria-hidden="true">
            <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="5" width="13" height="16" rx="2"></rect>
              <path d="M8 5V3a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-2"></path>
            </svg>
          </div>
          <h1 class="game-title">FlipMatch</h1>
          <p class="game-subtitle">Train your brain. Beat your best score.</p>
        </header>

        <!-- Difficulty Selection -->
        <section class="option-group">
          <label class="group-label">Difficulty Level</label>
          <div class="pill-group" role="radiogroup" aria-label="Difficulty Level">
            <button class="diff-btn active" data-level="easy" aria-checked="true" role="radio">
              <span class="pill-name">Easy</span>
              <span class="pill-meta">4 × 4 · 8 Pairs</span>
            </button>
            <button class="diff-btn" data-level="medium" aria-checked="false" role="radio">
              <span class="pill-name">Medium</span>
              <span class="pill-meta">6 × 6 · 18 Pairs</span>
            </button>
            <button class="diff-btn" data-level="hard" aria-checked="false" role="radio">
              <span class="pill-name">Hard</span>
              <span class="pill-meta">8 × 8 · 32 Pairs</span>
            </button>
          </div>
        </section>

        <!-- Theme Selection -->
        <section class="option-group">
          <label class="group-label">Card Theme</label>
          <div class="pill-group grid-2col" role="radiogroup" aria-label="Card Theme">
            <button class="theme-btn active" data-theme="fruits" aria-checked="true" role="radio">
              <span>Fruits</span>
            </button>
            <button class="theme-btn" data-theme="emojis" aria-checked="false" role="radio">
              <span>Emojis</span>
            </button>
            <button class="theme-btn" data-theme="animals" aria-checked="false" role="radio">
              <span>Animals</span>
            </button>
            <button class="theme-btn" data-theme="numbers" aria-checked="false" role="radio">
              <span>Numbers</span>
            </button>
          </div>
        </section>

        <!-- Personal Bests Dashboard -->
        <section class="records-summary">
          <span class="records-title">Best Records</span>
          <div class="records-chips">
            <div class="record-chip">
              <span class="chip-label">Easy</span>
              <span class="chip-value" id="record-easy">—</span>
            </div>
            <div class="record-chip">
              <span class="chip-label">Medium</span>
              <span class="chip-value" id="record-medium">—</span>
            </div>
            <div class="record-chip">
              <span class="chip-label">Hard</span>
              <span class="chip-value" id="record-hard">—</span>
            </div>
          </div>
        </section>

        <button id="start-btn" class="cta-primary-btn">
          <span>Play Now</span>
          <span class="btn-arrow">→</span>
        </button>
      </div>
    </main>

    <!-- Game Container -->
    <main id="game-container" class="screen-view" style="display: none">
      <!-- Game Top Navigation -->
      <nav class="game-nav">
        <button id="exit-btn" class="nav-btn" title="Back to Menu" aria-label="Exit to Menu">
          <svg class="icon-svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          <span class="nav-btn-text">Menu</span>
        </button>
        <h2 class="nav-game-title">FlipMatch</h2>
        <div class="nav-right-slot">
          <span id="current-diff-badge" class="nav-badge">Easy</span>
        </div>
      </nav>

      <!-- Stats HUD -->
      <div class="stats-hud">
        <div class="hud-card">
          <div class="hud-icon-wrap" aria-hidden="true">
            <svg class="icon-svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
          </div>
          <div class="hud-meta">
            <span class="hud-label">Time</span>
            <span id="timer" class="hud-value">00:00</span>
          </div>
        </div>
        <div class="hud-card">
          <div class="hud-icon-wrap" aria-hidden="true">
            <svg class="icon-svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"></path>
            </svg>
          </div>
          <div class="hud-meta">
            <span class="hud-label">Moves</span>
            <span id="moves" class="hud-value">0</span>
          </div>
        </div>
        <div class="hud-card">
          <div class="hud-icon-wrap" aria-hidden="true">
            <svg class="icon-svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <path d="m9 12 2 2 4-4"></path>
            </svg>
          </div>
          <div class="hud-meta">
            <span class="hud-label">Matches</span>
            <span id="pairs-left" class="hud-value">0 / 8</span>
          </div>
        </div>
      </div>

      <!-- Game Board Container & Pause Overlay -->
      <div class="board-wrapper">
        <div id="game-board"></div>

        <!-- Pause Overlay (Anti-cheat) -->
        <div id="pause-overlay" class="pause-overlay hidden">
          <div class="pause-dialog">
            <div class="pause-icon" aria-hidden="true">
              <svg class="icon-svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="6" y="4" width="4" height="16"></rect>
                <rect x="14" y="4" width="4" height="16"></rect>
              </svg>
            </div>
            <h3>Game Paused</h3>
            <p>Cards are hidden while paused.</p>
            <button id="resume-dialog-btn" class="cta-primary-btn small">Resume Game</button>
          </div>
        </div>
      </div>

      <!-- Footer Buttons -->
      <footer class="game-controls-bar">
        <button id="pause-btn" class="control-btn warning">
          <svg id="pause-btn-icon-pause" class="icon-svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="6" y="4" width="4" height="16"></rect>
            <rect x="14" y="4" width="4" height="16"></rect>
          </svg>
          <svg id="pause-btn-icon-play" class="icon-svg hidden" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="5 3 19 12 5 21 5 3"></polygon>
          </svg>
          <span class="btn-label">Pause</span>
        </button>
        <button id="reset-btn" class="control-btn secondary">
          <svg class="icon-svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
            <path d="M3 3v5h5"></path>
          </svg>
          <span class="btn-label">Restart</span>
        </button>
      </footer>
    </main>

    <!-- Win Celebration Modal -->
    <div id="win-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="win-heading">
      <canvas id="confetti-canvas"></canvas>
      <div class="modal-card">
        <div class="win-header">
          <div class="trophy-badge" aria-hidden="true">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path>
              <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path>
              <path d="M4 22h16"></path>
              <path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"></path>
              <path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"></path>
              <path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"></path>
            </svg>
          </div>
          <h2 id="win-heading">Splendid!</h2>
          <p class="win-subtitle">You solved the puzzle</p>
        </div>

        <!-- Star Rating -->
        <div class="star-rating" id="star-rating">
          <span class="star filled">★</span>
          <span class="star filled">★</span>
          <span class="star filled">★</span>
        </div>

        <div class="win-stats-grid">
          <div class="win-stat-box">
            <div class="stat-icon-wrap" aria-hidden="true">
              <svg class="icon-svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <polyline points="12 6 12 12 16 14"></polyline>
              </svg>
            </div>
            <span class="stat-name">Time</span>
            <span id="final-time" class="stat-val">00:00</span>
          </div>
          <div class="win-stat-box">
            <div class="stat-icon-wrap" aria-hidden="true">
              <svg class="icon-svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"></path>
              </svg>
            </div>
            <span class="stat-name">Moves</span>
            <span id="final-moves" class="stat-val">0</span>
          </div>
          <div class="win-stat-box highlight">
            <div class="stat-icon-wrap" aria-hidden="true">
              <svg class="icon-svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
              </svg>
            </div>
            <span class="stat-name">Record</span>
            <span id="best-score" class="stat-val">—</span>
          </div>
        </div>

        <div id="new-record-badge" class="new-record-badge hidden">
          New Best Record!
        </div>

        <div class="modal-actions">
          <button id="play-again-btn" class="cta-primary-btn">
            <span>Play Again</span>
          </button>
          <button id="modal-menu-btn" class="cta-secondary-btn">
            <span>Main Menu</span>
          </button>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
